# Local / single-host deployment: two AgriSense replicas behind an nginx load balancer.
#
#   docker compose up --build -d          # then open http://localhost:8080
#   docker compose logs -f lb             # shows which replica served each request
#   docker compose down                   # keep data;  add -v to delete the volumes
#
# Settings (LLM provider, API keys, ...) are read from ./.env (copy .env.example). All optional.

name: agrisense

x-app: &app
  build:
    context: .
    target: runtime
  image: agrisense-ai:${AGRISENSE_TAG:-latest}
  restart: unless-stopped
  init: true
  env_file:
    - path: .env
      required: false
  environment:
    LLM_PROVIDER: ${LLM_PROVIDER:-none}
    TORCH_THREADS: ${TORCH_THREADS:-2}
  read_only: true                  # root filesystem is immutable ...
  tmpfs:
    - /tmp                         # ... except scratch space
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 2g
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 60s

services:
  app1:
    <<: *app
    volumes:
      - app1-data:/data            # each replica owns its SQLite history, photos and index
  app2:
    <<: *app
    volumes:
      - app2-data:/data

  lb:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    ports:
      - "${AGRISENSE_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  app1-data:
  app2-data:
