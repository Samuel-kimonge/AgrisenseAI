# Load balancer for the docker-compose stack (AgriSense AI / Streamlit).
#
# Streamlit keeps each browser session in memory inside ONE process and ties uploads
# and the websocket to it, so requests of a session must always reach the same replica
# ("sticky sessions"). Plain round-robin would break photo uploads and the chat.
#
# Stickiness: a cookie (asroute) holds a random id; nginx hashes it to pick the replica.
# First visit: no cookie -> hash of the unique request id (spreads new users evenly) and
# the same value is sent back as the cookie, so every later request hashes identically.
# If a replica fails, nginx re-hashes the session to a healthy one (that user loses only
# their in-memory chat session, not saved history on the other replica's volume).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    log_format lb '$remote_addr "$request" $status rt=$request_time upstream=$upstream_addr route=$route_key';
    access_log /dev/stdout lb;

    # Writable paths for a read-only root filesystem / non-root user
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Accept only our own 32-hex cookie format; anything else gets a fresh id.
    map $cookie_asroute $route_key {
        "~^[0-9a-f]{32}$" $cookie_asroute;
        default         $request_id;
    }

    upstream agrisense {
        hash $route_key consistent;
        server app1:8501 max_fails=2 fail_timeout=10s;
        server app2:8501 max_fails=2 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 8080;
        server_tokens off;
        client_max_body_size 10m;     # 8 MB image limit + multipart overhead

        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

        location / {
            proxy_pass http://agrisense;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Streamlit uses a websocket for the whole session
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            add_header Set-Cookie "asroute=$route_key; Path=/; Max-Age=86400; HttpOnly; SameSite=Lax" always;
        }
    }
}
