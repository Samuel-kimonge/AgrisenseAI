# Production: 3+ replicas, autoscaling, TLS. EDIT the three marked values before applying.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: agrisense-ai
    newName: registry.example.com/agrisense/agrisense-ai   # <-- EDIT: your registry/repository
    newTag: "0.1.0"                                          # <-- use an immutable tag (or @sha256 digest)
patches:
  - target: {kind: StatefulSet, name: agrisense}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 10Gi
  - target: {kind: HorizontalPodAutoscaler, name: agrisense}
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 8
  - target: {kind: Ingress, name: agrisense}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: agrisense.example.com                         # <-- EDIT: your domain
      - op: add
        path: /spec/tls
        value:
          - hosts: [agrisense.example.com]                   # <-- EDIT: same domain
            secretName: agrisense-tls
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod                              # requires cert-manager; remove if you bring your own cert
      - op: replace
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1session-cookie-secure
        value: "true"
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
        value: "true"
