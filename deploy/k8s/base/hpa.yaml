# Inference is CPU-bound, so scale on CPU. Scale-down is deliberately slow: removing a pod
# ends the in-memory sessions of its users.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agrisense
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: agrisense
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
