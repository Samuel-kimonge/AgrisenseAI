# NOT part of kustomization.yaml on purpose. Prefer creating the secret directly so that
# keys never land in git:
#
#   kubectl -n agrisense create secret generic agrisense-secrets \
#     --from-literal=ANTHROPIC_API_KEY='...'   # or OPENAI_API_KEY
#
# The StatefulSet reads both keys as OPTIONAL, so the app runs without this Secret
# (assistant then answers with grounded knowledge-base excerpts).
apiVersion: v1
kind: Secret
metadata:
  name: agrisense-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
