# Default-deny for the app pods, then allow only what is needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agrisense
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agrisense-ai
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8501
          protocol: TCP
  egress:
    - to:                      # DNS
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:                   # HTTPS to an LLM provider, only if one is configured
        - port: 443
          protocol: TCP
